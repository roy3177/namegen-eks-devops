apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: namegen
  labels:
    app: namegen
    component: database
    environment: production
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: namegen
      component: database
  template:
    metadata:
      labels:
        app: namegen
        component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
  # volumeClaimTemplates gives this StatefulSet its own PersistentVolumeClaim,
  # backed by an EBS volume via the aws-ebs-csi-driver addon.
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-gp3
        resources:
          requests:
            storage: 2Gi
