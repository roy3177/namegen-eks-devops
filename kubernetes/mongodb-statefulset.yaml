apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: namegen
  labels:
    app: namegen
    component: database
    environment: production
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: namegen
      component: database
  template:
    metadata:
      labels:
        app: namegen
        component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: password
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
  # volumeClaimTemplates gives this StatefulSet its own PersistentVolumeClaim,
  # backed by an EBS volume. No storageClassName is set — EKS Auto Mode
  # automatically provisions and marks its own StorageClass as default.
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
