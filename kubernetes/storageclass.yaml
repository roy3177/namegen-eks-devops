# EKS Auto Mode registers its own built-in EBS CSI driver
# (ebs.csi.eks.amazonaws.com) but does not create a default StorageClass —
# that's still on us to define, same as the classic approach, just with a
# different provisioner name.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs-sc
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
